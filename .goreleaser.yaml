version: 2

project_name: folderlink

builds:
  # Console binary for macOS and Linux, and for Windows when the user runs
  # commands by hand: its output has to be visible.
  - id: bridge
    dir: apps/bridge
    main: ./cmd/bridge
    binary: folderlink
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  # Windows console binary, same code as above.
  - id: bridge-windows
    dir: apps/bridge
    main: ./cmd/bridge
    binary: folderlink
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - windows
    goarch:
      - amd64
      - arm64

  # Windows background binary, same code, built with the windowsgui
  # subsystem so it has no console window. The scheduled task created by
  # `folderlink install` runs this one; `folderlink run` must never be
  # started from it, because its output goes nowhere.
  - id: bridge-bg
    dir: apps/bridge
    main: ./cmd/bridge
    binary: folderlink-bg
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }}
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # Beta tags must still be the latest release so /releases/latest/download works.
  prerelease: false
  draft: false
  make_latest: true

# Checksum signing is not configured. Cosign needs a key that this
# repository does not have, and the free GoReleaser build cannot skip a
# signs block with an if condition.

changelog:
  disable: true
