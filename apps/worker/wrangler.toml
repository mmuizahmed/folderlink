name = "mcp-bridge"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Defaults for local development. Set WEB_ORIGIN and PUBLIC_BASE_URL
# to the deployed host before a real deployment. Do not set DEV_AUTH here.

[vars]
WEB_ORIGIN = "http://localhost:5173"
PUBLIC_BASE_URL = "http://127.0.0.1:8787"
TOKEN_TTL_SECONDS = "2700"

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceAgent"]

[[d1_databases]]
binding = "DB"
database_name = "mcp-bridge"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
