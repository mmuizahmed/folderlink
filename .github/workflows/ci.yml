name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/bridge/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: apps/bridge
      - name: Cross-compile the bridge
        working-directory: apps/bridge
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/bridge
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/bridge
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/bridge

  flow:
    name: Bridge, worker, and tool flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/bridge/go.sum
      - run: pnpm install --frozen-lockfile
      - run: node scripts/e2e-full.mjs

  ui:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcp-bridge/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mcp-bridge/web test:ui
