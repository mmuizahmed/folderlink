name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache-dependency-path: apps/bridge/go.sum
      - id: notes
        run: |
          notes=".github/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "args=--release-notes ${notes}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Sign the Windows binaries with SignPath Foundation (free for OSS).
  # Skipped entirely until the SignPath secrets exist — until then releases
  # ship unsigned exactly as today. Setup: .github/SIGNPATH_SETUP.md
  sign-windows:
    needs: goreleaser
    if: needs.goreleaser.result == 'success' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the unsigned Windows zips
        run: |
          mkdir -p work
          cd work
          gh release download "$TAG" --pattern 'folderlink*_windows_*.zip' --dir unsigned
          mkdir -p amd64 arm64 bg-amd64 bg-arm64
          unzip -q unsigned/folderlink_windows_amd64.zip -d amd64
          unzip -q unsigned/folderlink_windows_arm64.zip -d arm64
          unzip -q unsigned/folderlink-bg_windows_amd64.zip -d bg-amd64
          unzip -q unsigned/folderlink-bg_windows_arm64.zip -d bg-arm64

      - name: Upload unsigned folderlink.exe (amd64)
        id: upload-amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-folderlink-amd64
          path: work/amd64/folderlink.exe
          retention-days: 1

      - name: Sign folderlink.exe (amd64)
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: folderlink
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.upload-amd64.outputs.artifact-id }}
          output-artifact-directory: work/amd64/signed

      - name: Replace with the signed exe (amd64)
        run: mv work/amd64/signed/folderlink.exe work/amd64/folderlink.exe

      - name: Upload unsigned folderlink.exe (arm64)
        id: upload-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-folderlink-arm64
          path: work/arm64/folderlink.exe
          retention-days: 1

      - name: Sign folderlink.exe (arm64)
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: folderlink
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.upload-arm64.outputs.artifact-id }}
          output-artifact-directory: work/arm64/signed

      - name: Replace with the signed exe (arm64)
        run: mv work/arm64/signed/folderlink.exe work/arm64/folderlink.exe

      - name: Upload unsigned folderlink-bg.exe (amd64)
        id: upload-bg-amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-folderlink-bg-amd64
          path: work/bg-amd64/folderlink-bg.exe
          retention-days: 1

      - name: Sign folderlink-bg.exe (amd64)
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: folderlink
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.upload-bg-amd64.outputs.artifact-id }}
          output-artifact-directory: work/bg-amd64/signed

      - name: Replace with the signed exe (amd64)
        run: mv work/bg-amd64/signed/folderlink-bg.exe work/bg-amd64/folderlink-bg.exe

      - name: Upload unsigned folderlink-bg.exe (arm64)
        id: upload-bg-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-folderlink-bg-arm64
          path: work/bg-arm64/folderlink-bg.exe
          retention-days: 1

      - name: Sign folderlink-bg.exe (arm64)
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: folderlink
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.upload-bg-arm64.outputs.artifact-id }}
          output-artifact-directory: work/bg-arm64/signed

      - name: Replace with the signed exe (arm64)
        run: mv work/bg-arm64/signed/folderlink-bg.exe work/bg-arm64/folderlink-bg.exe

      - name: Re-zip the signed Windows archives
        run: |
          cd work
          (cd amd64 && zip -q ../folderlink_windows_amd64.zip LICENSE README.md folderlink.exe)
          (cd arm64 && zip -q ../folderlink_windows_arm64.zip LICENSE README.md folderlink.exe)
          (cd bg-amd64 && zip -q ../folderlink-bg_windows_amd64.zip LICENSE README.md folderlink-bg.exe)
          (cd bg-arm64 && zip -q ../folderlink-bg_windows_arm64.zip LICENSE README.md folderlink-bg.exe)

      - name: Regenerate checksums and re-upload the signed zips
        run: |
          mkdir -p final
          cd final
          gh release download "$TAG" --dir .
          cp ../work/folderlink_windows_amd64.zip ../work/folderlink_windows_arm64.zip ../work/folderlink-bg_windows_amd64.zip ../work/folderlink-bg_windows_arm64.zip .
          rm -f checksums.txt
          sha256sum folderlink* > checksums.txt
          gh release upload "$TAG" folderlink_windows_amd64.zip folderlink_windows_arm64.zip folderlink-bg_windows_amd64.zip folderlink-bg_windows_arm64.zip checksums.txt --clobber
