name: Deploy

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  worker:
    if: github.ref == 'refs/heads/main' && github.repository == 'mmuizahmed/mcp-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject a local production config
        run: node scripts/deploy-preflight.mjs
      - name: Build the website
        run: pnpm --filter @mcp-bridge/web build
      - name: Confirm the Cloudflare account
        working-directory: apps/worker
        run: pnpm exec wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: List D1 databases
        working-directory: apps/worker
        run: pnpm exec wrangler d1 list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply folderlink --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # After a successful deploy, tag the release automatically: no more
  # manual tag commands. A tag pushed by a workflow with GITHUB_TOKEN
  # does NOT trigger the Release workflow (GitHub drops runs caused by
  # GITHUB_TOKEN to prevent loops), so after pushing the tag this job
  # dispatches the Release workflow explicitly with `gh workflow run`
  # (workflow_dispatch is the one trigger GITHUB_TOKEN can still fire).
  # A tag is only created when main has commits the last release does
  # not, so re-running Deploy on an unchanged main creates nothing.
  tag-release:
    needs: worker
    if: github.ref == 'refs/heads/main' && github.repository == 'mmuizahmed/mcp-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # The dispatch step calls the workflow-dispatch API, which requires
      # actions: write. contents: write alone is not enough — without
      # this the dispatch fails with 403 "Resource not accessible by
      # integration" even though the tag push succeeds.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the release
        id: tag
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            if [ "$(git rev-list "$latest"..HEAD --count)" -eq 0 ]; then
              echo "No new commits since $latest — nothing to release."
              exit 0
            fi
            # Strip a pre-release suffix (-beta.1) before bumping the patch number.
            base="${latest%%-*}"
            major="$(echo "$base" | cut -d. -f1)"
            minor="$(echo "$base" | cut -d. -f2)"
            patch="$(echo "$base" | cut -d. -f3)"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Tagging $next."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - name: Dispatch the release workflow
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.tag.outputs.tag }}"
